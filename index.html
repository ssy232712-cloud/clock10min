<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반짝반짝 시계 퀴즈 (10분 단위)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 나눔고딕 등 가독성 좋은 폰트 적용 -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nanum Gothic', sans-serif;
      background-color: #f0fdf4; /* 포근하고 편안한 연초록 연상 배경 */
      touch-action: manipulation; /* 터치 기기에서 더블탭 줌 방지 */
    }
    .star-animation {
      animation: star-bounce 0.5s ease-out;
    }
    @keyframes star-bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    .shaker {
      animation: shake 0.5s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    
    /* 선택된 버튼 스타일 부드러운 전환 */
    .btn-transition {
      transition: all 0.2s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 overflow-x-hidden">

  <!-- 메인 게임 영역 컨테이너 -->
  <div class="max-w-6xl w-full mx-auto bg-white rounded-3xl shadow-xl border-4 border-green-200 p-4 md:p-6 flex-grow flex flex-col">
    
    <!-- 상단 헤더: 제목 및 점수판 -->
    <div class="text-center mb-4">
      <h1 class="text-3xl md:text-4xl font-black text-green-700 flex items-center justify-center gap-3">
        ⏰ <span>똑딱똑딱 시계 공부</span>
      </h1>
      <p class="text-base md:text-lg text-gray-700 mt-2 font-bold bg-green-50 inline-block px-4 py-1 rounded-full border border-green-200">
        별 <span class="text-red-500 text-xl">20개</span>를 모으면 대성공! ⭐
      </p>
    </div>

    <!-- 진행 표시줄 (20개 별 판) -->
    <div class="bg-amber-50 rounded-2xl p-4 border-2 border-amber-200 mb-6">
      <div class="flex justify-between items-center mb-3">
        <span class="text-base font-extrabold text-amber-800">나의 별 모으기:</span>
        <span id="streak-text" class="text-xl font-black text-amber-600">0 / 20 ⭐</span>
      </div>
      <div id="star-container" class="flex flex-wrap gap-2 justify-center">
        <!-- JS에서 20개의 별을 생성함 -->
      </div>
    </div>

    <!-- 핵심 학습 영역: 시계와 입력창 나란히 배치 -->
    <div class="flex flex-col lg:flex-row gap-8 items-stretch flex-grow">
      
      <!-- 1. 아날로그 시계 영역 (왼쪽) -->
      <div class="w-full lg:w-1/2 flex flex-col items-center justify-center">
        <div class="w-full max-w-[400px] relative bg-white p-4 rounded-[2rem] border-4 border-gray-200 shadow-lg flex flex-col items-center">
          
          <!-- 시계 보기 힌트 박스 (항상 노출) -->
          <div class="w-full bg-gray-50 rounded-xl p-3 border border-gray-200 mb-4 flex justify-around shadow-inner">
            <div class="flex items-center gap-2">
              <span class="w-4 h-4 rounded-full bg-red-500 block"></span>
              <span class="text-red-600 font-black text-sm md:text-base">짧은 바늘 = 시</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="w-4 h-4 rounded-full bg-blue-500 block"></span>
              <span class="text-blue-600 font-black text-sm md:text-base">긴 바늘 = 분</span>
            </div>
          </div>

          <!-- 시계 캔버스 -->
          <canvas id="clock-canvas" width="400" height="400" class="max-w-full h-auto drop-shadow-md"></canvas>
        </div>
      </div>

      <!-- 2. 숫자 입력 영역 (오른쪽) -->
      <div class="w-full lg:w-1/2 flex flex-col justify-between bg-gray-50 rounded-[2rem] p-4 md:p-6 border-4 border-gray-100 shadow-inner">
        
        <!-- 내가 선택한 시간 크게 보기 -->
        <div class="bg-white rounded-2xl p-4 border-2 border-gray-200 shadow mb-6 text-center">
          <span class="text-gray-500 font-bold text-sm mb-2 block">내가 고른 시간</span>
          <div class="flex justify-center items-end gap-2 md:gap-4">
            <div class="flex flex-col items-center">
              <div id="display-hour" class="text-5xl md:text-6xl font-black text-red-500 h-16 md:h-20 flex items-center">--</div>
              <span class="text-xl font-bold text-gray-700 mt-1">시</span>
            </div>
            <div class="text-4xl text-gray-300 font-black mb-6">:</div>
            <div class="flex flex-col items-center">
              <div id="display-minute" class="text-5xl md:text-6xl font-black text-blue-500 h-16 md:h-20 flex items-center">--</div>
              <span class="text-xl font-bold text-gray-700 mt-1">분</span>
            </div>
          </div>
        </div>

        <!-- 입력 패드 컨테이너 (스크롤 방지를 위해 적절한 간격 조정) -->
        <div class="flex-grow flex flex-col gap-4">
          
          <!-- '시' 선택 자판 -->
          <div class="bg-red-50 rounded-2xl p-4 border border-red-200">
            <p class="text-red-700 font-black text-lg mb-3 flex items-center gap-2">
              <span class="bg-red-500 text-white px-2 py-1 rounded-lg text-sm">1</span> 몇 시 인가요?
            </p>
            <div class="grid grid-cols-4 gap-2 md:gap-3" id="hour-pad">
              <!-- JS에서 생성 -->
            </div>
          </div>

          <!-- '분' 선택 자판 (10분 단위) -->
          <div class="bg-blue-50 rounded-2xl p-4 border border-blue-200">
            <p class="text-blue-700 font-black text-lg mb-3 flex items-center gap-2">
              <span class="bg-blue-500 text-white px-2 py-1 rounded-lg text-sm">2</span> 몇 분 인가요?
            </p>
            <div class="grid grid-cols-3 gap-2 md:gap-3" id="minute-pad">
              <!-- JS에서 생성 -->
            </div>
          </div>

        </div>

        <!-- 제출 버튼 및 피드백 -->
        <div class="mt-6 flex flex-col gap-3">
          <button id="submit-btn" onclick="checkAnswer()" class="w-full py-4 bg-gray-300 text-gray-500 font-black text-2xl rounded-2xl shadow-lg border-b-4 border-gray-400 cursor-not-allowed transition-all" disabled>
            시와 분을 모두 골라주세요
          </button>
          
          <div id="feedback-box" class="h-16 flex items-center justify-center rounded-xl text-lg md:text-xl font-bold text-center transition-all opacity-0">
            <!-- 피드백 글자가 들어옴 -->
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- 대성공 축하 모달 -->
  <div id="victory-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl border-8 border-yellow-400 p-8 max-w-md w-full text-center shadow-2xl relative">
      <div class="text-7xl mb-4 animate-bounce">🏆</div>
      <h2 class="text-4xl font-black text-amber-600 mb-2">대 성공!</h2>
      <p class="text-xl font-bold text-gray-700 mb-6 leading-relaxed">
        최고예요!<br>
        시계 읽기 달인이 되었어요! ⭐<br>
        별 <span class="text-red-500 text-3xl font-black">20개</span>를 다 모았어요!
      </p>
      
      <div class="flex justify-center gap-3 mb-8">
        <span class="text-4xl star-animation" style="animation-delay: 0s;">⭐</span>
        <span class="text-4xl star-animation" style="animation-delay: 0.2s;">⭐</span>
        <span class="text-4xl star-animation" style="animation-delay: 0.4s;">⭐</span>
      </div>

      <button onclick="closeVictoryModal()" class="w-full py-5 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white font-black text-2xl rounded-2xl shadow-xl border-b-4 border-amber-700 active:border-b-0 active:translate-y-1 transition-all">
        다시 해볼래요!
      </button>
    </div>
  </div>

  <script>
    // --- 게임 상태 변수 ---
    let streak = 0; // 연속 정답 수
    let targetHour = 12; // 1~12
    let targetMinute = 0; // 0, 10, 20, 30, 40, 50
    let selectedHour = null; 
    let selectedMinute = null;

    const possibleMinutes = [0, 10, 20, 30, 40, 50];

    const canvas = document.getElementById('clock-canvas');
    const ctx = canvas.getContext('2d');

    // --- 오디오 처리 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(frequency, type, duration, startTimeOffset = 0) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = frequency;
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime + startTimeOffset);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTimeOffset + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + startTimeOffset);
        osc.stop(audioCtx.currentTime + startTimeOffset + duration);
      } catch (e) {
        console.log("오디오 재생 불가", e);
      }
    }

    function playCorrectSound() {
      playBeep(523.25, 'sine', 0.15, 0);       // C5
      playBeep(659.25, 'sine', 0.15, 0.12);    // E5
      playBeep(783.99, 'sine', 0.3, 0.24);     // G5
    }

    function playWrongSound() {
      playBeep(220.00, 'triangle', 0.4, 0);    // A3 낮고 부드럽게
    }

    function playVictorySound() {
      const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
      scale.forEach((freq, idx) => playBeep(freq, 'triangle', 0.15, idx * 0.15));
      setTimeout(() => {
        playBeep(1046.50, 'sine', 0.8, 0);
        playBeep(1318.51, 'sine', 0.8, 0.05);
        playBeep(1567.98, 'sine', 0.8, 0.1);
      }, 1200);
    }

    window.onload = function() {
      initStars();
      buildPads();
      resetGame(false);
      window.addEventListener('resize', drawClock);
    };

    function initStars() {
      const container = document.getElementById('star-container');
      container.innerHTML = '';
      for (let i = 1; i <= 20; i++) {
        const star = document.createElement('div');
        star.id = `star-${i}`;
        // 기본 별 (비어있는 상태)
        star.className = "w-8 h-8 flex items-center justify-center bg-gray-200 border-2 border-gray-300 rounded-full text-sm font-black text-gray-400 shadow-sm transition-all duration-300";
        star.innerText = i;
        container.appendChild(star);
      }
    }

    function resetGame(fullReset = false) {
      if (fullReset) {
        streak = 0;
        updateStarUI();
      }
      
      // 문제 생성
      targetHour = Math.floor(Math.random() * 12) + 1; // 1 ~ 12
      targetMinute = possibleMinutes[Math.floor(Math.random() * possibleMinutes.length)];
      
      // 입력 초기화
      selectedHour = null;
      selectedMinute = null;
      
      updateDisplay();
      updatePadsUI();
      hideFeedback();
      
      drawClock();
    }

    // 입력 패드(버튼들) HTML 생성
    function buildPads() {
      const hourPad = document.getElementById('hour-pad');
      hourPad.innerHTML = '';
      for (let i = 1; i <= 12; i++) {
        const btn = document.createElement('button');
        btn.id = `btn-hour-${i}`;
        btn.onclick = () => selectHour(i);
        btn.className = "btn-transition py-3 rounded-xl text-xl font-black border-b-4 active:border-b-0 active:translate-y-1 bg-white text-red-700 border-red-200 hover:bg-red-50";
        btn.innerText = i;
        hourPad.appendChild(btn);
      }

      const minutePad = document.getElementById('minute-pad');
      minutePad.innerHTML = '';
      possibleMinutes.forEach(m => {
        const btn = document.createElement('button');
        btn.id = `btn-minute-${m}`;
        btn.onclick = () => selectMinute(m);
        btn.className = "btn-transition py-3 rounded-xl text-xl font-black border-b-4 active:border-b-0 active:translate-y-1 bg-white text-blue-700 border-blue-200 hover:bg-blue-50";
        btn.innerText = m === 0 ? "00" : m;
        minutePad.appendChild(btn);
      });
    }

    function selectHour(h) {
      initAudio(); // 첫 터치 활성화
      selectedHour = h;
      updateDisplay();
      updatePadsUI();
      checkSubmitReady();
    }

    function selectMinute(m) {
      initAudio();
      selectedMinute = m;
      updateDisplay();
      updatePadsUI();
      checkSubmitReady();
    }

    // 선택된 값 화면 표출
    function updateDisplay() {
      const hDisp = document.getElementById('display-hour');
      const mDisp = document.getElementById('display-minute');
      
      hDisp.innerText = selectedHour !== null ? selectedHour : '--';
      mDisp.innerText = selectedMinute !== null ? (selectedMinute === 0 ? '00' : selectedMinute) : '--';
    }

    // 선택된 버튼 색상 강조
    function updatePadsUI() {
      // 시간 버튼 업데이트
      for (let i = 1; i <= 12; i++) {
        const btn = document.getElementById(`btn-hour-${i}`);
        if (i === selectedHour) {
          btn.className = "btn-transition py-3 rounded-xl text-xl font-black border-b-4 active:border-b-0 active:translate-y-1 bg-red-500 text-white border-red-700 shadow-md transform scale-105";
        } else {
          btn.className = "btn-transition py-3 rounded-xl text-xl font-black border-b-4 active:border-b-0 active:translate-y-1 bg-white text-red-600 border-red-200 hover:bg-red-50";
        }
      }
      
      // 분 버튼 업데이트
      possibleMinutes.forEach(m => {
        const btn = document.getElementById(`btn-minute-${m}`);
        if (m === selectedMinute) {
          btn.className = "btn-transition py-3 rounded-xl text-xl font-black border-b-4 active:border-b-0 active:translate-y-1 bg-blue-500 text-white border-blue-700 shadow-md transform scale-105";
        } else {
          btn.className = "btn-transition py-3 rounded-xl text-xl font-black border-b-4 active:border-b-0 active:translate-y-1 bg-white text-blue-600 border-blue-200 hover:bg-blue-50";
        }
      });
    }

    // 두 가지 모두 선택했을 때 제출 버튼 활성화
    function checkSubmitReady() {
      const btn = document.getElementById('submit-btn');
      if (selectedHour !== null && selectedMinute !== null) {
        btn.disabled = false;
        btn.className = "w-full py-4 bg-green-500 hover:bg-green-600 text-white font-black text-2xl rounded-2xl shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition-all transform hover:scale-[1.02] cursor-pointer";
        btn.innerHTML = "✅ 정답 확인하기!";
      } else {
        btn.disabled = true;
        btn.className = "w-full py-4 bg-gray-300 text-gray-500 font-black text-2xl rounded-2xl shadow border-b-4 border-gray-400 cursor-not-allowed transition-all";
        btn.innerHTML = "시와 분을 모두 골라주세요";
      }
    }

    function checkAnswer() {
      const fb = document.getElementById('feedback-box');
      fb.classList.remove('opacity-0');
      
      // 정답 확인
      if (selectedHour === targetHour && selectedMinute === targetMinute) {
        // 성공
        streak++;
        playCorrectSound();
        
        fb.innerHTML = "⭕ <strong>정답입니다!</strong> 정말 잘했어요! 👍";
        fb.className = "mt-4 h-16 flex items-center justify-center rounded-xl text-xl font-black text-center bg-green-100 text-green-800 border-2 border-green-400 transition-all opacity-100";
        
        updateStarUI();

        if (streak >= 20) {
          setTimeout(() => showVictoryModal(), 800);
        } else {
          setTimeout(() => resetGame(false), 1500);
        }
      } else {
        // 실패
        streak = 0;
        playWrongSound();
        
        const mStr = targetMinute === 0 ? "00" : targetMinute;
        fb.innerHTML = `❌ 아쉬워요. 정답은 <strong>${targetHour}시 ${mStr}분</strong> 이에요. 다시 해볼까요?`;
        fb.className = "mt-4 h-16 flex flex-col items-center justify-center rounded-xl text-lg font-black text-center bg-red-100 text-red-800 border-2 border-red-300 shaker transition-all opacity-100 px-2";
        
        updateStarUI();
        setTimeout(() => resetGame(false), 3000);
      }
      
      // 제출 후 버튼 잠시 비활성화 방지용
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
    }

    function hideFeedback() {
      const fb = document.getElementById('feedback-box');
      fb.classList.add('opacity-0');
      fb.classList.remove('shaker');
    }

    function updateStarUI() {
      document.getElementById('streak-text').innerText = `${streak} / 20 ⭐`;
      
      for (let i = 1; i <= 20; i++) {
        const star = document.getElementById(`star-${i}`);
        if (i <= streak) {
          star.className = "w-8 h-8 flex items-center justify-center bg-amber-400 border-2 border-yellow-500 rounded-full text-sm font-black text-white shadow-md star-animation";
          star.innerText = "⭐";
        } else {
          star.className = "w-8 h-8 flex items-center justify-center bg-gray-200 border-2 border-gray-300 rounded-full text-sm font-black text-gray-400 shadow-sm";
          star.innerText = i;
        }
      }
    }

    function drawClock() {
      // 캔버스 크기를 부모 컨테이너에 맞춤 (HDPI 대응 포함)
      const rect = canvas.parentElement.getBoundingClientRect();
      const size = 400; // 고정 해상도로 그리고 CSS로 줄임
      canvas.width = size;
      canvas.height = size;
      
      const radius = size / 2;
      ctx.clearRect(0, 0, size, size);
      ctx.translate(radius, radius);

      // 1. 기본 시계 바탕
      ctx.beginPath();
      ctx.arc(0, 0, radius - 5, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#4ade80'; // 밝은 초록 테두리
      ctx.stroke();

      // 2. 안쪽 보조 테두리
      ctx.beginPath();
      ctx.arc(0, 0, radius - 12, 0, 2 * Math.PI);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#22c55e';
      ctx.stroke();

      // 3. '시' 숫자 그리기 (크고 굵은 검은색)
      ctx.font = `bold ${size * 0.12}px 'Nanum Gothic'`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#111827';
      const hourRadius = radius - 60; // 숫자를 안쪽으로

      for (let num = 1; num <= 12; num++) {
        const angle = (num * 30 * Math.PI) / 180;
        const x = hourRadius * Math.sin(angle);
        const y = -hourRadius * Math.cos(angle);
        ctx.fillText(num.toString(), x, y);
      }

      // 4. '분' 숫자 그리기 (시각적 단서 제공: 작고 파란색, 외곽선)
      ctx.font = `bold ${size * 0.05}px 'Nanum Gothic'`;
      ctx.fillStyle = '#3b82f6'; // 파란색
      const minRadius = radius - 25; // 외곽 가장자리에 배치

      for (let m = 0; m < 60; m += 5) { // 0, 5, 10 ... 55
        // 숫자 0은 가독성을 위해 00으로 표시
        const text = m === 0 ? "00" : m.toString(); 
        const angle = (m * 6 * Math.PI) / 180;
        const x = minRadius * Math.sin(angle);
        const y = -minRadius * Math.cos(angle);
        ctx.fillText(text, x, y);
      }

      // 5. 눈금 그리기 (분침 가이드)
      for (let i = 0; i < 60; i++) {
        const angle = (i * 6 * Math.PI) / 180;
        ctx.beginPath();
        if (i % 5 === 0) {
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#111827'; // 5분 단위는 진하게
          ctx.moveTo((radius - 40) * Math.sin(angle), -(radius - 40) * Math.cos(angle));
        } else {
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#d1d5db'; // 1분 단위는 옅게
          ctx.moveTo((radius - 35) * Math.sin(angle), -(radius - 35) * Math.cos(angle));
        }
        ctx.lineTo((radius - 30) * Math.sin(angle), -(radius - 30) * Math.cos(angle));
        ctx.stroke();
      }

      // 6. 시침 (빨간색, 굵고 짧게)
      // 10분 단위로 이동할 때마다 시침도 정밀하게 움직임
      const hrAngle = ((targetHour % 12) * 30 + (targetMinute * 0.5)) * Math.PI / 180;
      drawHand(hrAngle, radius * 0.45, 14, '#ef4444');

      // 7. 분침 (파란색, 얇고 길게 - 파란색 분 숫자까지 닿도록)
      const minAngle = (targetMinute * 6) * Math.PI / 180;
      drawHand(minAngle, radius * 0.70, 8, '#3b82f6');

      // 8. 중심 핀
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, 2 * Math.PI);
      ctx.fillStyle = '#1f2937';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.translate(-radius, -radius);
    }

    // 바늘 그리기 공통 함수
    function drawHand(angle, length, width, color) {
      ctx.save();
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.strokeStyle = color;
      ctx.rotate(angle);
      ctx.moveTo(0, 15); // 반대쪽 꼬리
      ctx.lineTo(0, -length);
      ctx.stroke();
      ctx.restore();
    }

    function showVictoryModal() {
      playVictorySound();
      const modal = document.getElementById('victory-modal');
      modal.classList.remove('hidden');
    }

    function closeVictoryModal() {
      const modal = document.getElementById('victory-modal');
      modal.classList.add('hidden');
      resetGame(true);
    }
  </script>
</body>
</html>
